[project]
name = "secmate-deepteam-worker"
version = "0.1.0"
description = "Isolated SecMate DeepTeam assessment worker"
requires-python = ">=3.11,<3.12"
dependencies = [
  "httpx==0.28.1",
  "pydantic==2.13.5",
  "python-dotenv==1.2.3",
]

[project.optional-dependencies]
runtime = [
  "deepeval==3.6.2",
  "deepteam @ git+https://github.com/Paramount-Assure/deepteam.git@2fd3445c5bb2070ce09834f66f1622eb914f6f46",
]
test = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-repeat==0.9.4",
]

[project.scripts]
secmate-worker-doctor = "secmate_worker.doctor:main"
secmate-worker-export-schemas = "secmate_worker.schema_export:main"
secmate-worker-gold-set = "secmate_worker.gold_set:main"
secmate-worker-chatmate-gold = "secmate_worker.chatmate_gold:main"
secmate-worker-chatmate-candidates = "secmate_worker.chatmate_candidates:main"
secmate-worker-manual-chatmate = "secmate_worker.manual_chatmate:main"
secmate-worker-judge-calibration = "secmate_worker.judge_calibration:main"
secmate-worker-model-smoke = "secmate_worker.model_smoke:main"
secmate-worker-single-attack = "secmate_worker.single_attack:main"

[tool.pytest.ini_options]
addopts = ["-p", "no:plugins"]
filterwarnings = [
  "ignore:Support for class-based `config` is deprecated:DeprecationWarning:deepeval.*",
]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secmate_worker"]

[tool.hatch.metadata]
allow-direct-references = true
