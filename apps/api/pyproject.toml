[project]
name = "secmate-api"
version = "0.1.0"
description = "Local SecMate model connectivity API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "httpx>=0.28.1",
  "python-dotenv>=1.1.1",
  "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secmate_api"]
